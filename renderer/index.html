<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: frameflow:; media-src 'self' data: blob: frameflow:; font-src 'self' data:; connect-src 'self'"
    />
    <meta name="color-scheme" content="dark" />
    <title>帧渡 FrameFerry</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <header class="titlebar">
        <div class="brand">
          <span class="logo-mark" id="brand-logo"></span>
          <div class="brand-text">
            <div class="brand-name">帧渡</div>
            <div class="brand-en">FRAMEFERRY</div>
          </div>
        </div>

        <nav class="app-menu" id="app-menu">
          <button class="menu-trigger" data-menu="file">文件</button>
          <button class="menu-trigger" data-menu="tasks">任务<span class="menu-count" id="menu-job-count" hidden>0</span></button>
          <button class="menu-trigger" data-menu="help">帮助</button>

          <div class="menu-popover menu-file" id="menu-file" hidden>
            <button class="menu-item" data-action="add-files"><span data-icon="folder"></span><span>添加视频…</span><span class="menu-shortcut">Ctrl O</span></button>
            <button class="menu-item" data-action="show-output"><span data-icon="copy"></span><span>在文件夹中显示输出</span></button>
            <div class="menu-separator"></div>
            <button class="menu-item" data-action="quit"><span data-icon="power"></span><span>退出帧渡</span><span class="menu-shortcut">Alt F4</span></button>
          </div>
          <div class="menu-popover menu-tasks" id="menu-tasks" hidden>
            <button class="menu-item" data-action="history"><span data-icon="history"></span><span>转换记录</span><span class="menu-shortcut" id="menu-history-count">0</span></button>
            <button class="menu-item" data-action="clear-finished"><span data-icon="trash"></span><span>清除已完成任务</span></button>
            <div class="menu-separator"></div>
            <div class="menu-status"><span class="status-dot" id="menu-job-dot"></span><span id="menu-job-status">当前没有进行中的任务</span></div>
          </div>
          <div class="menu-popover menu-help" id="menu-help" hidden>
            <button class="menu-item" data-action="shortcuts"><span data-icon="keyboard"></span><span>键盘快捷键</span></button>
            <button class="menu-item" data-action="about"><span data-icon="info"></span><span>关于帧渡</span></button>
            <div class="menu-separator"></div>
            <div class="menu-status"><span data-icon="list"></span><span>本地引擎 · FFmpeg <span id="menu-engine">检测中</span></span></div>
          </div>
        </nav>

        <div class="titlebar-center">
          <span class="privacy-dot"></span>
          <span>离线处理</span>
          <span class="titlebar-divider"></span>
          <span class="titlebar-muted">文件不会离开这台电脑</span>
        </div>

        <div class="titlebar-actions">
          <button class="titlebar-icon" id="history-button" title="转换记录"><span data-icon="history"></span><span class="icon-badge" id="history-badge" hidden>0</span></button>
          <div class="window-controls">
            <button class="window-btn" data-window="minimize" aria-label="最小化"><span data-icon="minus"></span></button>
            <button class="window-btn" data-window="maximize" aria-label="最大化"><span data-icon="square" id="maximize-icon"></span></button>
            <button class="window-btn window-close" data-window="close" aria-label="关闭"><span data-icon="x"></span></button>
          </div>
        </div>
      </header>

      <div class="app-body">
        <aside class="source-rail">
          <div class="rail-head">
            <div>
              <span class="eyebrow">LIBRARY</span>
              <h1>素材库<span class="count-pill" id="file-count">0</span></h1>
            </div>
            <button class="icon-button" id="add-files" title="添加视频 (Ctrl+O)"><span data-icon="plus"></span></button>
          </div>

          <button class="import-card" id="import-card">
            <span class="import-icon"><span data-icon="folder"></span></span>
            <span>
              <strong>添加视频</strong>
              <small>或直接拖入窗口</small>
            </span>
            <span class="import-plus">+</span>
          </button>

          <div class="rail-section-head">
            <span>本机素材</span>
            <span id="rail-count"></span>
          </div>

          <div class="file-list" id="file-list"></div>

          <div class="rail-footer">
            <div class="rail-footer-icon"><span data-icon="film"></span></div>
            <div>
              <span id="rail-summary">支持的视频格式</span>
              <small>MP4 · MOV · MKV · WebM · AVI · GIF</small>
            </div>
          </div>
        </aside>

        <section class="preview-column">
          <div class="preview-head">
            <div>
              <span class="eyebrow">PREVIEW / 01</span>
              <h2>素材预览</h2>
            </div>
            <div class="preview-head-actions">
              <span class="engine-chip" id="preview-engine-chip"><span class="engine-dot"></span><span id="preview-engine-text">预览就绪</span></span>
              <button class="ghost-button" id="set-cover" title="把当前画面设为素材封面"><span data-icon="image"></span>设为封面</button>
              <button class="ghost-button" id="system-player"><span data-icon="clapperboard"></span>系统播放器</button>
            </div>
          </div>
          <div id="preview-body"></div>
        </section>

        <aside class="inspector">
          <div class="inspector-head">
            <div>
              <span class="eyebrow">EXPORT SETTINGS</span>
              <h2>输出设置</h2>
            </div>
            <button class="text-button" id="reset-settings"><span data-icon="rotate"></span>重置</button>
          </div>
          <div class="inspector-scroll" id="inspector-scroll">
            <div id="settings-root"></div>
          </div>
          <div class="inspector-dock" id="inspector-dock"></div>
        </aside>
      </div>

      <footer class="statusbar">
        <div class="status-left">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-engine">引擎检测中</span>
          <span class="status-sep"></span>
          <span class="status-mono" id="status-version">FFmpeg —</span>
          <span class="status-sep"></span>
          <span class="status-hw" id="status-hw"><span data-icon="cpu"></span>CPU</span>
        </div>
        <div class="status-center"><span data-icon="lock"></span>本地处理 · 无云端上传</div>
        <div class="status-right">
          <span class="status-idle" id="status-job">空闲</span>
          <span class="status-sep"></span>
          <span class="status-mono" id="status-app-version">v1.0.0</span>
        </div>
      </footer>

      <div class="drop-overlay" id="drop-overlay" hidden>
        <div class="drop-frame">
          <div class="drop-icon"><span data-icon="download"></span></div>
          <span class="eyebrow">DROP TO IMPORT</span>
          <h3>松手，放进帧渡</h3>
          <p>支持 MP4 / MOV / MKV / WebM / AVI / GIF</p>
        </div>
      </div>
    </div>

    <div id="modal-root"></div>
    <div class="toast-stack" id="toast-stack"></div>

    <script src="app.js"></script>
  </body>
</html>
